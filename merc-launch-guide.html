<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MミRC Global Launch Guide - Guild Docs - Ashura Whole Heavens</title>
<meta name="description" content="MミRC guild members-only: the AION 2 Global Launch comprehensive new player guide (all mechanics, classes and progression).">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/theme.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/profile-chip.js"></script>
<script src="assets/analytics.js"></script>
<style>
  .gd-wrap { max-width: 1000px; margin: 32px auto; }
  .gd-gate { max-width: 560px; margin: 30px auto; padding: 28px 24px; border-radius: 16px; text-align: center;
    background: var(--panel); border: 1px solid var(--panel-border); backdrop-filter: blur(10px); }
  .gd-gate h3 { margin: 0 0 8px; } .gd-gate p { color: var(--muted); margin: 0 0 16px; }
  .gd-btn { display:inline-flex; align-items:center; gap:8px; text-decoration:none; cursor:pointer;
    font-weight:800; font-size:15px; padding:12px 22px; border-radius:12px; color:#fff; border:none;
    background: linear-gradient(120deg, var(--accent-2), var(--accent)); }
  .gd-btn:hover { filter:brightness(1.1); }
  .gd-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .gd-head h1 { margin:0; line-height:1.1; }
  .gd-head .gd-sub { color:var(--accent-2); font-weight:800; letter-spacing:0.04em; }
  .gd-actions { margin-left:auto; display:flex; gap:10px; flex-wrap:wrap; }
  .gd-pdf-wrap { position:relative; width:100%; height:82vh; min-height:560px; border-radius:14px; overflow:hidden;
    border:1px solid var(--panel-border); background:#0b0a0e; box-shadow:0 16px 40px rgba(0,0,0,0.5); }
  .gd-pdf-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .gd-loading { text-align:center; color:var(--muted); padding:40px 0; }
  .gd-note { color:var(--muted); font-size:13px; margin-top:10px; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<nav id="site-nav" data-active="roster"></nav>

<div class="content">
  <div class="gd-wrap">
    <div id="gd-root"><div class="gd-loading">Verifying guild membership…</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/sol.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/background.js"></script>
<script src="assets/audio.js"></script>
<script>
(function () {
  var root = document.getElementById('gd-root');
  if (!window.Sol) { root.innerHTML = '<div class="gd-gate"><p>Guild docs are temporarily unavailable.</p></div>'; return; }

  var PDF = 'assets/merc-aion2-launch-guide.pdf';

  function gate(loggedIn) {
    root.innerHTML = '<div class="gd-gate"><h3>🔒 Guild Docs - Members Only</h3>' +
      '<p>The MミRC Global Launch Guide is available to confirmed roster members. ' +
      (loggedIn ? 'Your roster signup is not confirmed yet - once the guild master approves you, this unlocks.'
                : 'Log in with Discord and sign up for the roster to unlock it.') + '</p>' +
      (loggedIn ? '<a class="gd-btn" href="roster.html">Go to the Roster</a>'
                : '<button class="gd-btn" id="gd-login">🎮 Log in with Discord</button>') +
      '</div>';
    var b = document.getElementById('gd-login');
    if (b) b.addEventListener('click', function () { Sol.loginWith('discord'); });
  }

  function showDoc() {
    root.innerHTML =
      '<div class="gd-head">' +
        '<div><div class="gd-sub">Guild Docs</div><h1>MミRC Global Launch Guide</h1></div>' +
        '<div class="gd-actions">' +
          '<a class="gd-btn" href="' + PDF + '" target="_blank" rel="noopener">↗ Open full screen</a>' +
          '<a class="gd-btn" style="background:linear-gradient(120deg,#5865F2,#4752c4);" href="' + PDF + '" download>⬇ Download PDF</a>' +
        '</div>' +
      '</div>' +
      '<p class="gd-note">Comprehensive AION 2 new-player guide - all mechanics, classes, and progression. Compiled from KR/Taiwan launches + NCSoft official. If the viewer does not load, use "Open full screen" or "Download PDF".</p>' +
      '<div style="margin:8px 0 14px;"><a href="roster.html" style="color:var(--muted);text-decoration:none;font-size:14px;">← Back to Roster</a> &nbsp;·&nbsp; <a href="merc-day-one-guide.html" style="color:var(--muted);text-decoration:none;font-size:14px;">📖 Day One Guide</a></div>' +
      '<div class="gd-pdf-wrap"><iframe src="' + PDF + '#view=FitH" title="MミRC AION 2 Global Launch Guide"></iframe></div>';
  }

  function render() {
    var safe = function (p) { return Promise.resolve(p).then(function (v) { return v; }, function () { return false; }); };
    Sol.getUser().then(function (user) {
      if (!user) { gate(false); return; }
      return Promise.all([
        safe(Sol.isRosterMember()),
        safe(Sol.amIRosterAdmin()),
        safe(Sol.myProfile().then(function (p) { return p && p.role === 'sol_king'; }))
      ]).then(function (res) {
        if (res[0] || res[1] || res[2]) { showDoc(); }
        else { gate(true); }
      });
    }).catch(function (e) {
      console.error('[launch-guide] membership check failed:', e);
      gate(true);
    });
  }

  render();
  Sol.onAuthChange(function () { render(); });
})();
</script>
</body>
</html>
