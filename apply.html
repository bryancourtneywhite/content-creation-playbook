<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&#12511;RC Guild Application - Ashura Whole Heavens</title>
<meta name="description" content="Apply to the M&#12511;RC AION 2 guild. Log in with Discord, fill out the application, and the guild master reviews you for the roster.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://solashur.com/apply.html">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/theme.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/profile-chip.js"></script>
<script src="assets/analytics.js"></script>
<style>
  .ap-wrap { max-width: 780px; margin: 30px auto; }

  /* hero banner */
  .ap-hero { position:relative; border-radius:18px; overflow:hidden; margin-bottom:22px;
    border:1px solid var(--panel-border); box-shadow:0 10px 40px rgba(0,0,0,0.45); }
  .ap-hero img { display:block; width:100%; height:260px; object-fit:cover; object-position:center 30%; }
  .ap-hero::after { content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,8,12,0.15) 0%, rgba(10,8,12,0.55) 55%, rgba(10,8,12,0.92) 100%); }
  .ap-hero-txt { position:absolute; left:0; right:0; bottom:0; padding:20px 24px; z-index:2; }
  .ap-hero-txt .kicker { color:var(--accent-2); font-weight:800; letter-spacing:0.12em; text-transform:uppercase; font-size:12px; }
  .ap-hero-txt h1 { margin:4px 0 6px; font-size:clamp(26px,5vw,40px); line-height:1.05; }
  .ap-hero-txt p { margin:0; color:#e6e0ea; font-size:14px; max-width:56ch; }
  .ap-motto { font-style:italic; color:var(--accent-2); font-weight:700; }

  /* panels + form */
  .ap-panel { padding:24px 22px; border-radius:16px; background:var(--panel);
    border:1px solid var(--panel-border); backdrop-filter:blur(10px); margin-bottom:18px; }
  .ap-panel h3 { margin:0 0 6px; }
  .ap-panel p.sub { color:var(--muted); margin:0 0 4px; font-size:14px; }

  .ap-btn { display:inline-flex; align-items:center; gap:8px; text-decoration:none; cursor:pointer;
    font-weight:800; font-size:15px; padding:13px 24px; border-radius:12px; color:#fff; border:none;
    background:linear-gradient(120deg, var(--accent-2), var(--accent)); transition:filter .15s ease, transform .1s ease; }
  .ap-btn:hover { filter:brightness(1.1); transform:scale(1.02); }
  .ap-btn.discord { background:linear-gradient(120deg,#5865F2,#4752c4); }
  .ap-btn:disabled { opacity:.6; cursor:default; transform:none; }

  .ap-form { display:flex; flex-direction:column; gap:18px; margin-top:14px; }
  .ap-field { display:flex; flex-direction:column; gap:6px; }
  .ap-field > label { font-size:13.5px; font-weight:800; color:var(--text); }
  .ap-field .req { color:var(--accent-2); margin-left:3px; }
  .ap-field .hint { font-size:12px; font-weight:500; color:var(--muted); }
  .ap-field input, .ap-field select, .ap-field textarea {
    width:100%; padding:12px 14px; border-radius:10px; background:rgba(0,0,0,0.28);
    border:1px solid var(--panel-border); color:var(--text); font-size:14px; font-family:inherit; outline:none;
    transition:border-color .15s ease; }
  .ap-field input:focus, .ap-field select:focus, .ap-field textarea:focus { border-color:var(--accent-2); }
  [data-theme="light"] .ap-field input, [data-theme="light"] .ap-field select, [data-theme="light"] .ap-field textarea { background:rgba(20,60,110,0.05); }
  .ap-field textarea { resize:vertical; min-height:70px; }

  /* segmented button groups (archetype, playtime, economic) */
  .ap-seg { display:flex; flex-wrap:wrap; gap:8px; }
  .ap-seg button { flex:1 1 auto; min-width:120px; padding:11px 14px; border-radius:10px; cursor:pointer;
    font-weight:700; font-size:13.5px; text-align:center; color:var(--text);
    background:rgba(255,255,255,0.04); border:1px solid var(--panel-border); transition:all .12s ease; }
  .ap-seg button:hover { border-color:var(--accent-2); }
  .ap-seg button.sel { background:linear-gradient(120deg,var(--accent-2),var(--accent)); color:#fff; border-color:transparent; }

  /* flex scale 1-5 */
  .ap-scale { display:flex; gap:8px; align-items:stretch; }
  .ap-scale button { flex:1; padding:12px 0; border-radius:10px; cursor:pointer; font-weight:900; font-size:18px;
    color:var(--text); background:rgba(255,255,255,0.04); border:1px solid var(--panel-border); transition:all .12s ease; }
  .ap-scale button:hover { border-color:var(--accent-2); }
  .ap-scale button.sel { background:linear-gradient(120deg,var(--accent-2),var(--accent)); color:#fff; border-color:transparent; }
  .ap-scale-ends { display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:2px; }

  .ap-msg { font-size:13.5px; font-weight:700; min-height:18px; }
  .ap-msg.err { color:#ff8089; }
  .ap-msg.ok { color:#8fe6a3; }
  .ap-note { font-size:12.5px; color:var(--muted); text-align:center; margin-top:6px; }
  .ap-loading { text-align:center; color:var(--muted); padding:44px 0; }

  /* status screen */
  .ap-status-badge { display:inline-block; padding:7px 16px; border-radius:999px; font-weight:800; font-size:13px; }
  .ap-status-badge.pending { background:rgba(255,180,60,0.16); color:#ffb43c; border:1px solid rgba(255,180,60,0.4); }
  .ap-status-badge.confirmed { background:rgba(74,214,107,0.16); color:#8fe6a3; border:1px solid rgba(74,214,107,0.45); }
  .ap-status-badge.rejected { background:rgba(160,160,170,0.14); color:var(--muted); border:1px solid var(--panel-border); }
  .ap-links { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
  .ap-link { text-decoration:none; font-weight:700; font-size:14px; padding:10px 18px; border-radius:10px;
    color:var(--text); border:1px solid var(--panel-border); background:rgba(255,255,255,0.04); }
  .ap-link:hover { border-color:var(--accent-2); }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<nav id="site-nav" data-active="roster"></nav>

<div class="content">
  <div class="ap-wrap">

    <div class="ap-hero">
      <img src="assets/merc-apply-banner.webp" alt="M&#12511;RC guild" loading="eager">
      <div class="ap-hero-txt">
        <div class="kicker">&#9876;&#65039; Guild Recruitment</div>
        <h1>M&#12511;RC Guild Application</h1>
        <p>Interested in joining M&#12511;RC? You are in the right place. Fill this out and we will add you to the roster if you are a good fit. <span class="ap-motto">We are M&#12511;RC - we fight who is strong.</span></p>
      </div>
    </div>

    <div id="ap-root">
      <div class="ap-loading">Loading the application&#8230;</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/sol.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/background.js"></script>
<script src="assets/audio.js"></script>
<script>
(function () {
  var root = document.getElementById('ap-root');
  if (!window.Sol) { root.innerHTML = '<div class="ap-panel"><p>The application is temporarily unavailable.</p></div>'; return; }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  var CLASSES = ['Templar','Gladiator','Sorcerer','Ranger','Assassin','Cleric','Chanter','Spiritmaster'];
  var ROLES   = ['Tank','DPS','Healer','Support / Off-Heal'];        // roster guild_role enum
  var ARCHETYPES = ['Tank','Healer','DPS','Support / Utility'];      // application archetype
  var PLAYTIMES  = ['< 4 hours','4-8 hours','8-12 hours','Degenerate hours (12+)'];
  var ECONOMICS  = ['F2P','Light Spender','Pay-To-Win / Whale'];

  // ---- login gate --------------------------------------------------------
  function gate() {
    root.innerHTML =
      '<div class="ap-panel" style="text-align:center;">' +
      '<h3>&#128274; Log in to apply</h3>' +
      '<p class="sub">Applications tie to your Discord account so we can reach you and unlock guild docs the moment you are accepted.</p>' +
      '<div style="margin-top:16px;"><button class="ap-btn discord" id="ap-login">&#127918; Log in with Discord</button></div>' +
      '</div>';
    document.getElementById('ap-login').addEventListener('click', function () { Sol.loginWith('discord'); });
  }

  // ---- already-applied status screen ------------------------------------
  function statusScreen(row) {
    var st = row.status;
    var badge = st === 'confirmed'
      ? '<span class="ap-status-badge confirmed">&#9989; Accepted</span>'
      : (st === 'rejected'
        ? '<span class="ap-status-badge rejected">Not accepted</span>'
        : '<span class="ap-status-badge pending">&#9203; Under review</span>');
    var body = st === 'confirmed'
      ? 'You are on the M&#12511;RC roster. Every members-only guild doc is unlocked for you.'
      : (st === 'rejected'
        ? 'Your application was not accepted this time. You can revise and resubmit, or reach out in Discord.'
        : 'Your application as <strong>' + esc(row.player_name) + '</strong> (' + esc(row.aion_class) + ' &middot; ' + esc(row.guild_role) + ') is with the guild master. We will follow up in Discord.');
    root.innerHTML =
      '<div class="ap-panel" style="text-align:center;">' +
      '<h3>Application submitted</h3>' +
      '<p style="margin:10px 0;">' + badge + '</p>' +
      '<p class="sub">' + body + '</p>' +
      '<div class="ap-links">' +
        (st === 'confirmed'
          ? '<a class="ap-link" href="roster.html">&#9876;&#65039; View the Roster</a>' +
            '<a class="ap-link" href="merc-day-one-guide.html">&#128214; Day One Guide</a>' +
            '<a class="ap-link" href="merc-launch-guide.html">&#128216; Launch Guide</a>'
          : '<button class="ap-link" id="ap-edit">&#9998; Edit my application</button>' +
            '<a class="ap-link" href="roster.html">Roster status</a>') +
      '</div></div>';
    var e = document.getElementById('ap-edit');
    if (e) e.addEventListener('click', function () { formScreen(row); });
  }

  // ---- the application form ---------------------------------------------
  function formScreen(existing) {
    existing = existing || {};
    var chosen = {
      archetype: existing.archetype || '',
      flex:      (existing.flex_scale != null ? String(existing.flex_scale) : ''),
      playtime:  existing.daily_playtime || '',
      economic:  existing.economic_profile || ''
    };
    var opts = function (arr, sel) {
      return '<option value="" disabled' + (!sel ? ' selected' : '') + '>Select&#8230;</option>' +
        arr.map(function (v) { return '<option' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
    };
    var seg = function (name, arr, sel) {
      return '<div class="ap-seg" data-seg="' + name + '">' +
        arr.map(function (v) { return '<button type="button" data-val="' + esc(v) + '"' + (v === sel ? ' class="sel"' : '') + '>' + esc(v) + '</button>'; }).join('') +
      '</div>';
    };
    var scale = function (sel) {
      var b = '';
      for (var i = 1; i <= 5; i++) { b += '<button type="button" data-val="' + i + '"' + (String(i) === sel ? ' class="sel"' : '') + '>' + i + '</button>'; }
      return '<div class="ap-scale" data-seg="flex">' + b + '</div>' +
        '<div class="ap-scale-ends"><span>1 &middot; Hard-locked to main</span><span>Will swap to whatever the raid needs &middot; 5</span></div>';
    };

    root.innerHTML =
      '<div class="ap-panel"><div class="ap-form">' +

        '<div class="ap-field">' +
          '<label>Discord username <span class="req">*</span></label>' +
          '<span class="hint">So we can reach you. E.g. username or username#0000.</span>' +
          '<input id="f-discord" maxlength="64" value="' + esc(existing.discord_handle || '') + '" placeholder="your_discord">' +
        '</div>' +

        '<div class="ap-field">' +
          '<label>In-game name <span class="req">*</span></label>' +
          '<span class="hint">Your main AION 2 character name.</span>' +
          '<input id="f-name" maxlength="32" value="' + esc(existing.player_name || '') + '" placeholder="Your IGN">' +
        '</div>' +

        '<div class="ap-field">' +
          '<label>IGN history</label>' +
          '<span class="hint">Other names you normally hold.</span>' +
          '<input id="f-ign" maxlength="200" value="' + esc(existing.ign_history || '') + '" placeholder="Names you go by">' +
        '</div>' +

        '<div class="ap-field">' +
          '<label>Intended main class <span class="req">*</span></label>' +
          '<select id="f-class">' + opts(CLASSES, existing.aion_class) + '</select>' +
          '<span class="hint">Brawler is confirmed absent for launch.</span>' +
        '</div>' +

        '<div class="ap-field">' +
          '<label>Primary archetype / role <span class="req">*</span></label>' +
          seg('archetype', ARCHETYPES, chosen.archetype) +
        '</div>' +

        '<div class="ap-field">' +
          '<label>Roster role <span class="req">*</span></label>' +
          '<span class="hint">How you slot into raid comp on the roster.</span>' +
          '<select id="f-role">' + opts(ROLES, existing.guild_role) + '</select>' +
        '</div>' +

        '<div class="ap-field">' +
          '<label>Willingness to flex class/role <span class="req">*</span></label>' +
          scale(chosen.flex) +
        '</div>' +

        '<div class="ap-field">' +
          '<label>Competitive MMO / PvP history</label>' +
          '<span class="hint">Notable accomplishments, high-tier PvP ranks, or hardcore raiding in WoW, Lineage, Lost Ark, original Aion, etc.</span>' +
          '<textarea id="f-pvp" maxlength="800" rows="3" placeholder="Your track record">' + esc(existing.pvp_history || '') + '</textarea>' +
        '</div>' +

        '<div class="ap-field">' +
          '<label>Gameplay footage / VOD link</label>' +
          '<span class="hint">YouTube, Twitch, or Streamable showing high-level PvP or endgame raid mechanics. Applications with footage are prioritized over those without.</span>' +
          '<input id="f-vod" maxlength="300" value="' + esc(existing.vod_link || '') + '" placeholder="https://">' +
        '</div>' +

        '<div class="ap-field">' +
          '<label>Expected daily playtime (first 2 weeks) <span class="req">*</span></label>' +
          seg('playtime', PLAYTIMES, chosen.playtime) +
        '</div>' +

        '<div class="ap-field">' +
          '<label>Timezone</label>' +
          '<span class="hint">Helps us build ideal static groups for you.</span>' +
          '<input id="f-tz" maxlength="60" value="' + esc(existing.timezone || '') + '" placeholder="e.g. EST / GMT+1 / PST">' +
        '</div>' +

        '<div class="ap-field">' +
          '<label>Economic strategy <span class="req">*</span></label>' +
          seg('economic', ECONOMICS, chosen.economic) +
          '<span class="hint">Light Spender = in-game membership / battle passes only. Whale = willing to heavily invest.</span>' +
        '</div>' +

        '<div class="ap-field">' +
          '<label>Anything else?</label>' +
          '<textarea id="f-note" maxlength="300" rows="2" placeholder="Anything the guild master should know">' + esc(existing.note || '') + '</textarea>' +
        '</div>' +

        '<button class="ap-btn" id="f-submit">' + (existing.status ? 'Update application' : 'Submit application') + '</button>' +
        '<div class="ap-msg" id="f-msg"></div>' +
        '<div class="ap-note">You must be logged in with Discord. Accepted applicants are added to the roster and all members-only docs unlock automatically.</div>' +
      '</div></div>';

    // wire segmented groups (single-select)
    root.querySelectorAll('.ap-seg, .ap-scale').forEach(function (grp) {
      var key = grp.getAttribute('data-seg');
      grp.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          grp.querySelectorAll('button').forEach(function (x) { x.classList.remove('sel'); });
          b.classList.add('sel');
          chosen[key] = b.getAttribute('data-val');
        });
      });
    });

    document.getElementById('f-submit').addEventListener('click', function () {
      var msg = document.getElementById('f-msg');
      msg.className = 'ap-msg';
      var app = {
        discord:    document.getElementById('f-discord').value.trim(),
        name:       document.getElementById('f-name').value.trim(),
        ignHistory: document.getElementById('f-ign').value.trim(),
        aionClass:  document.getElementById('f-class').value,
        archetype:  chosen.archetype,
        guildRole:  document.getElementById('f-role').value,
        flex:       chosen.flex,
        pvpHistory: document.getElementById('f-pvp').value.trim(),
        vod:        document.getElementById('f-vod').value.trim(),
        playtime:   chosen.playtime,
        timezone:   document.getElementById('f-tz').value.trim(),
        economic:   chosen.economic,
        note:       document.getElementById('f-note').value.trim()
      };
      // required-field validation
      var missing = [];
      if (app.discord.length < 2) missing.push('Discord username');
      if (app.name.length < 2) missing.push('in-game name');
      if (!app.aionClass) missing.push('main class');
      if (!app.archetype) missing.push('archetype');
      if (!app.guildRole) missing.push('roster role');
      if (!app.flex) missing.push('flex willingness');
      if (!app.playtime) missing.push('daily playtime');
      if (!app.economic) missing.push('economic strategy');
      if (missing.length) { msg.className = 'ap-msg err'; msg.textContent = 'Please fill: ' + missing.join(', ') + '.'; return; }

      var btn = document.getElementById('f-submit');
      btn.disabled = true;
      msg.textContent = 'Submitting your application' + String.fromCharCode(8230);
      Sol.rosterApply(app).then(function (row) {
        msg.className = 'ap-msg ok'; msg.textContent = 'Application received.';
        statusScreen(row);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }).catch(function (e) {
        btn.disabled = false;
        msg.className = 'ap-msg err';
        msg.textContent = 'Could not submit: ' + ((e && e.message) || 'please try again');
      });
    });
  }

  // ---- boot --------------------------------------------------------------
  function render() {
    Sol.getUser().then(function (user) {
      if (!user) { gate(); return; }
      return Sol.myRoster().then(function (row) {
        // If already confirmed OR pending, show status (with an edit path).
        if (row && (row.status === 'confirmed' || row.status === 'pending')) { statusScreen(row); }
        else { formScreen(row || {}); }   // rejected or brand-new -> show form (prefilled if rejected)
      });
    }).catch(function () {
      // never leave the page hanging on an auth/RPC hiccup
      formScreen({});
    });
  }

  // re-render on login/logout
  if (Sol.onAuthChange) Sol.onAuthChange(function () { render(); });
  render();
})();
</script>
</body>
</html>
