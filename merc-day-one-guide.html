<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MミRC Day One Guide - Guild Docs - Ashura Whole Heavens</title>
<meta name="description" content="MミRC guild members-only: the AION 2 Day One Guide, zero to 2500 Combat Power.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/theme.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/profile-chip.js"></script>
<script src="assets/analytics.js"></script>
<style>
  .gd-wrap { max-width: 900px; margin: 32px auto; }
  .gd-gate { max-width: 560px; margin: 30px auto; padding: 28px 24px; border-radius: 16px; text-align: center;
    background: var(--panel); border: 1px solid var(--panel-border); backdrop-filter: blur(10px); }
  .gd-gate h3 { margin: 0 0 8px; } .gd-gate p { color: var(--muted); margin: 0 0 16px; }
  .gd-btn { display:inline-flex; align-items:center; gap:8px; text-decoration:none; cursor:pointer;
    font-weight:800; font-size:15px; padding:12px 22px; border-radius:12px; color:#fff; border:none;
    background: linear-gradient(120deg, var(--accent-2), var(--accent)); }
  .gd-btn:hover { filter:brightness(1.1); }
  .gd-body { display:none; }
  .gd-doc h1 { margin: 0 0 4px; }
  .gd-doc .gd-sub { color: var(--accent-2); font-weight: 800; letter-spacing: 0.04em; margin-bottom: 18px; }
  .gd-doc h2 { margin: 30px 0 6px; padding-top: 14px; border-top: 1px solid var(--panel-border); color: var(--accent-2); }
  .gd-doc h3 { margin: 18px 0 6px; }
  .gd-doc p, .gd-doc li { line-height: 1.55; }
  .gd-doc ul, .gd-doc ol { padding-left: 22px; }
  .gd-callout { border-left: 4px solid var(--accent); background: rgba(214,30,44,0.08);
    padding: 12px 16px; border-radius: 0 12px 12px 0; margin: 14px 0; }
  .gd-callout.warn { border-left-color:#ffb43c; background: rgba(255,180,60,0.1); }
  .gd-table { width:100%; border-collapse:collapse; margin: 12px 0; font-size: 14px; }
  .gd-table th, .gd-table td { text-align:left; padding: 9px 12px; border-bottom:1px solid var(--panel-border); vertical-align: top; }
  .gd-table th { color: var(--accent-2); text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; }
  .gd-phase { display:inline-block; font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px;
    background: rgba(214,30,44,0.14); color:#ff8089; border:1px solid rgba(214,30,44,0.35); margin-left: 8px; }
  .gd-flow { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.8;
    background: rgba(0,0,0,0.28); border:1px solid var(--panel-border); border-radius: 12px; padding: 14px 18px; white-space: pre-wrap; }
  [data-theme="light"] .gd-flow { background: rgba(20,60,110,0.05); }
  .gd-loading { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<nav id="site-nav" data-active="roster"></nav>

<div class="content">
  <div class="gd-wrap">
    <div id="gd-root"><div class="gd-loading">Verifying guild membership…</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/sol.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/background.js"></script>
<script src="assets/audio.js"></script>
<script>
(function () {
  var root = document.getElementById('gd-root');
  if (!window.Sol) { root.innerHTML = '<div class="gd-gate"><p>Guild docs are temporarily unavailable.</p></div>'; return; }

  function gate(loggedIn) {
    root.innerHTML = '<div class="gd-gate"><h3>🔒 Guild Docs - Members Only</h3>' +
      '<p>The MミRC Day One Guide is available to confirmed roster members. ' +
      (loggedIn ? 'Your roster signup is not confirmed yet - once the guild master approves you, this unlocks.'
                : 'Log in with Discord and sign up for the roster to unlock it.') + '</p>' +
      (loggedIn ? '<a class="gd-btn" href="roster.html">Go to the Roster</a>'
                : '<button class="gd-btn" id="gd-login">🎮 Log in with Discord</button>') +
      '</div>';
    var b = document.getElementById('gd-login');
    if (b) b.addEventListener('click', function () { Sol.loginWith('discord'); });
  }

  function showDoc() { document.getElementById('gd-doc').style.display = 'block'; }

  function render() {
    Sol.getUser().then(function (user) {
      if (!user) { gate(false); return; }
      Sol.isRosterMember().then(function (isMember) {
        if (!isMember) { gate(true); return; }
        root.innerHTML = DOC_HTML;
      });
    });
  }

  // ---- The Day One Guide content (rendered only for confirmed members) ----
  var DOC_HTML = [
    '<div class="gd-doc">',
    '<div style="margin-bottom:12px;"><a href="roster.html" style="color:var(--muted);text-decoration:none;font-size:14px;">← Back to Roster</a></div>',
    '<h1>MミRC - AION 2 Day One Guide</h1>',
    '<div class="gd-sub">Zero to 2500 Combat Power</div>',
    '<p><strong>Purpose:</strong> a step-by-step roadmap from character creation to Abyss-ready CP. Follow this in order - no wasted time, no wasted energy.</p>',

    '<h2>Key Glossary</h2>',
    '<table class="gd-table"><tr><th>Term</th><th>Meaning</th></tr>',
    '<tr><td>Main Story (Yellow Quests)</td><td>Your primary leveling path - gold quest markers</td></tr>',
    '<tr><td>Side Quests (Green Quests)</td><td>Optional - green markers. Only do ones that award gear or are on your path</td></tr>',
    '<tr><td>? Marks on Map</td><td>Undiscovered areas - a Sealed Dungeon or Rift Cave</td></tr>',
    '<tr><td>Sealed Dungeon</td><td>Treasure chests = Enhancement Materials + Kinah. Orb chests = Healing</td></tr>',
    '<tr><td>Secret Dungeons</td><td>Instanced dungeons awarding Daeva Points + Enhancement Items</td></tr>',
    '<tr><td>Expedition Conquest</td><td>Energy-gated content. Different tiers by CP requirement</td></tr>',
    '<tr><td>Daeva Points</td><td>Permanent stat boosts from completing dungeons/quests</td></tr>',
    '<tr><td>Monolith</td><td>Feather farming - passive CP source</td></tr>',
    '<tr><td>Abyss</td><td>Endgame PvPvE zone - requires minimum CP to enter</td></tr>',
    '</table>',

    '<h2>Phase 1: Leveling (Lv 1-45)<span class="gd-phase">Target ~600 CP</span></h2>',
    '<p><em>Time: 4-6 hours of focused play</em></p>',
    '<h3>Rules</h3><ul>',
    '<li>Follow the Main Story Quest (Yellow) exclusively - do not deviate</li>',
    '<li>Only complete Green Quests physically on your path (near the main objective)</li>',
    '<li>Skip all side content that takes you off the main route</li>',
    '<li>Do NOT enter Sealed or Secret Dungeons yet - save them for Phase 2</li>',
    '<li>Equip every gear upgrade the story hands you immediately</li></ul>',
    '<h3>Tips</h3><ul><li>Don\'t waste potions - story content is easy</li>',
    '<li>Don\'t enhance gear yet - you\'ll replace it in Phase 2</li>',
    '<li>If you out-level content, keep pushing story - XP scales</li></ul>',

    '<h2>Phase 2: Post-45 Gearing (Lv 45)<span class="gd-phase">Target 1000+ CP</span></h2>',
    '<p>You are locked from the Abyss until you hit the CP gate. This phase gets you there.</p>',
    '<h3>Step-by-Step</h3><ol>',
    '<li>Start at <strong>Garden of the Illusion</strong> and work North</li>',
    '<li>Complete ALL Secret Dungeons in order as you move north (Daeva Points + Enhancement Items)</li>',
    '<li>Complete ALL Green Quests that award gear in the same areas (Daeva Points + upgrades)</li>',
    '<li>Explore ? marks: Sealed Dungeons (Enhancement Mats + Kinah), Rift Caves (Daeva Points)</li>',
    '<li>Enhance your gear using stockpiled materials</li>',
    '<li>Unlock and level Pets - passive CP gain</li></ol>',
    '<div class="gd-callout warn">⚠️ <strong>Energy Management (CRITICAL):</strong> Do NOT spend energy on 1000 CP Expedition Conquest. Save ALL energy for 1600+ CP Expedition Conquest (Urugugu Canyon). The 1000 CP tier rewards are not worth the energy.</div>',
    '<p><strong>Other CP sources here:</strong> Pet grinding, Monolith feathers, Daeva Point accumulation, gear enhancement.</p>',

    '<h2>Phase 3: Abyss Entry (1000-1400 CP)</h2>',
    '<p>Once you hit ~1000 CP you can enter the Abyss - where real progression begins.</p>',
    '<h3>Farm the Abyss efficiently</h3><ul>',
    '<li>Form <strong>static groups</strong> (pre-made guild parties). Do NOT pug.</li>',
    '<li>Ideal comp: <strong>Tank + Healer + 2-3 DPS</strong></li>',
    '<li>Grind mobs that drop Abyss gear, enhancement materials, Kinah</li>',
    '<li>Complete Abyss daily/weekly quests</li>',
    '<li>PvP only when advantageous - don\'t waste time on fights you can\'t win at this CP</li>',
    '<li>Equip + enhance Abyss gear as it drops (replaces green quest gear)</li></ul>',
    '<h3>Static Group Rules</h3><ul><li>Stay together - splitting gets you ganked</li>',
    '<li>Rotate farming spots if contested</li><li>Call out enemy players early</li>',
    '<li>Prioritize efficiency over PvP kills</li></ul>',

    '<h2>Phase 4: Mid-Game Push (1400-1600 CP)</h2><ol>',
    '<li>Continue Abyss farming in static groups</li>',
    '<li>Max Daeva Points - revisit skipped Secret Dungeons / Green Quests</li>',
    '<li>Enhance all Abyss gear to +5 minimum</li>',
    '<li>Pet leveling (2-3 pets active by now)</li>',
    '<li>Daily Monolith runs</li>',
    '<li>Clear remaining ? marks</li>',
    '<li>Gear breakthrough - weapon first</li></ol>',
    '<div class="gd-callout">What NOT to do: don\'t waste kinah on marginal AH upgrades; don\'t spread enhancement mats across all gear (focus weapon &gt; chest &gt; legs); don\'t solo farm the Abyss.</div>',

    '<h2>Phase 5: Expedition Unlock (1600+ CP)</h2>',
    '<p>NOW you spend your saved energy.</p>',
    '<h3>Expedition Conquest - Urugugu Canyon (Recommended)</h3><ul>',
    '<li>Spend stockpiled energy on 1600+ CP Expedition Conquest</li>',
    '<li>Best return at this tier: high-tier enhancement mats, expedition-exclusive gear, big Daeva Points</li>',
    '<li>Run daily - energy regenerates, never cap out</li>',
    '<li>Group with guildmates for faster/safer clears</li></ul>',
    '<p><strong>In parallel:</strong> continue Abyss static farming, daily Monolith, pet grinding, enhance Expedition gear.</p>',

    '<h2>Phase 6: Push to 2500 CP</h2>',
    '<p>This is the grind. Consistency wins.</p>',
    '<h3>Daily Checklist</h3>',
    '<table class="gd-table"><tr><th>#</th><th>Activity</th><th>CP Source</th></tr>',
    '<tr><td>1</td><td>Expedition Conquest (Urugugu Canyon)</td><td>Gear + Enhancement Mats</td></tr>',
    '<tr><td>2</td><td>Abyss Static Group (1-2 hrs)</td><td>Abyss Gear + Kinah</td></tr>',
    '<tr><td>3</td><td>Monolith (feather farm)</td><td>Passive CP</td></tr>',
    '<tr><td>4</td><td>Pet Leveling</td><td>Stat Bonuses</td></tr>',
    '<tr><td>5</td><td>Daily/Weekly Quests</td><td>Daeva Points + Mats</td></tr>',
    '<tr><td>6</td><td>Gear Enhancement</td><td>Direct CP gain</td></tr></table>',
    '<h3>Enhancement Priority</h3><ol><li>Weapon (biggest CP per level)</li><li>Chest</li><li>Legs</li><li>Helmet</li><li>Gloves / Boots</li><li>Accessories</li></ol>',
    '<h3>Gear Tier Progression</h3><p>Green Quest Gear → Abyss Gear → Expedition Gear. Never enhance green gear past +3; Abyss gear worth +7-8; Expedition gear is endgame - enhance freely.</p>',
    '<h3>Breaking CP Walls</h3>',
    '<table class="gd-table"><tr><th>Stuck at</th><th>Solution</th></tr>',
    '<tr><td>1200</td><td>You missed Secret Dungeons - clear them all</td></tr>',
    '<tr><td>1400</td><td>Farm Sealed Dungeons + Abyss for enhancement mats</td></tr>',
    '<tr><td>1800</td><td>Spend energy on Urugugu Canyon Expeditions</td></tr>',
    '<tr><td>2000</td><td>Full enhance push - weapon to max, armor +8 min</td></tr>',
    '<tr><td>2200</td><td>Pets + Monolith + Daeva Points - check for underleveled</td></tr>',
    '<tr><td>2500</td><td>Full Expedition set enhanced + maxed pets + full Daeva tree</td></tr></table>',

    '<h2>Day One Optimal Timeline</h2>',
    '<table class="gd-table"><tr><th>Time Block</th><th>Activity</th><th>Target CP</th></tr>',
    '<tr><td>Hours 1-5</td><td>Main Story Lv 1-45</td><td>~600</td></tr>',
    '<tr><td>Hours 5-8</td><td>Garden of Illusion → North: Secret Dungeons + Green Quests</td><td>~1000</td></tr>',
    '<tr><td>Hours 8-12</td><td>Enter Abyss - static group farming</td><td>~1200</td></tr>',
    '<tr><td>Hours 12+</td><td>Continue Abyss + begin enhancement push</td><td>~1400+</td></tr></table>',

    '<h2>Guild Coordination</h2><ul>',
    '<li>Form static groups BEFORE launch - know your party members</li>',
    '<li>Designate Abyss farming shifts - avoid burnout, keep coverage</li>',
    '<li>Share Secret Dungeon locations in guild chat</li>',
    '<li>Call out Abyss PvP threats - protect farmers</li>',
    '<li>Don\'t compete with guildmates for spots - rotate or stack groups</li></ul>',

    '<h2>TL;DR - The Flow</h2>',
    '<div class="gd-flow">Main Story → 45\n   ↓\nGreen Quests + Secret Dungeons (Garden of Illusion → North)\n   ↓\n1000 CP → Enter Abyss (Static Groups)\n   ↓\n1600 CP → Expedition Conquest (Urugugu Canyon)\n   ↓\nDaily Loop: Expedition + Abyss + Monolith + Pets + Enhance\n   ↓\n2500 CP ✓</div>',

    '<p class="rs-meta" style="color:var(--muted);margin-top:22px;">Last Updated: Launch Day Prep - MミRC Guild. Questions? Ask in guild Discord #aion2-guides.</p>',
    '</div>'
  ].join('');

  render();
  Sol.onAuthChange(function () { render(); });
})();
</script>
</body>
</html>
