<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MミRC Roster — Ashura Whole Heavens</title>
<meta name="description" content="The MミRC AION 2 guild roster. Members-only: log in with Discord and sign up to join the operational roster.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://solashur.com/roster.html">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/theme.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/profile-chip.js"></script>
<script src="assets/analytics.js"></script>
<style>
  .rs-wrap { max-width: 960px; margin: 34px auto; }
  /* gate / signup panels */
  .rs-panel { max-width: 560px; margin: 24px auto; padding: 26px 24px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--panel-border); backdrop-filter: blur(10px); text-align: center; }
  .rs-panel h3 { margin: 0 0 8px; }
  .rs-panel p { color: var(--muted); margin: 0 0 16px; }
  .rs-btn { display:inline-flex; align-items:center; gap:8px; text-decoration:none; cursor:pointer;
    font-weight:800; font-size:15px; padding:12px 22px; border-radius:12px; color:#fff; border:none;
    background: linear-gradient(120deg, var(--accent-2), var(--accent)); transition: filter .15s ease, transform .1s ease; }
  .rs-btn:hover { filter:brightness(1.1); transform:scale(1.02); }
  .rs-btn.discord { background: linear-gradient(120deg,#5865F2,#4752c4); }
  .rs-form { text-align:left; display:flex; flex-direction:column; gap:14px; margin-top:8px; }
  .rs-form label { font-size:13px; font-weight:700; color:var(--text); display:block; margin-bottom:6px; }
  .rs-form input, .rs-form select, .rs-form textarea {
    width:100%; padding:11px 14px; border-radius:10px; background:rgba(0,0,0,0.25);
    border:1px solid var(--panel-border); color:var(--text); font-size:14px; font-family:inherit; outline:none; }
  [data-theme="light"] .rs-form input, [data-theme="light"] .rs-form select, [data-theme="light"] .rs-form textarea { background:rgba(20,60,110,0.05); }
  .rs-status-badge { display:inline-block; padding:6px 14px; border-radius:999px; font-weight:800; font-size:13px; }
  .rs-status-badge.pending { background:rgba(255,180,60,0.16); color:#ffb43c; border:1px solid rgba(255,180,60,0.4); }
  .rs-status-badge.rejected { background:rgba(160,160,170,0.14); color:var(--muted); border:1px solid var(--panel-border); }

  /* summary strip */
  .rs-summary { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:8px 0 22px; }
  .rs-stat { min-width:96px; padding:12px 16px; border-radius:12px; background:var(--panel); border:1px solid var(--panel-border); text-align:center; }
  .rs-stat .n { font-weight:900; font-size:22px; color:var(--accent-2); }
  .rs-stat .l { font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }

  /* roster groups */
  .rs-group { margin: 22px 0; }
  .rs-group-h { font-size:13px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent-2); margin:0 0 10px; }
  .rs-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .rs-card { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px;
    background:var(--panel); border:1px solid var(--panel-border); border-left:4px solid var(--cc,#888); }
  .rs-avatar { width:40px; height:40px; border-radius:50%; object-fit:cover; flex:0 0 auto; background:rgba(255,255,255,.08); border:1px solid var(--panel-border); }
  .rs-name { font-weight:800; line-height:1.15; }
  .rs-meta { font-size:12px; color:var(--muted); }
  .rs-tag-row { display:flex; gap:5px; flex-wrap:wrap; margin-top:4px; }
  .rs-chip { font-size:10px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; padding:2px 7px; border-radius:999px; border:1px solid var(--panel-border); color:var(--muted); }
  .rs-chip.war { background:rgba(214,30,44,.14); color:#ff8089; border-color:rgba(214,30,44,.4); }
  .rs-chip.core { background:rgba(255,210,74,.14); color:#ffd24a; border-color:rgba(255,210,74,.4); }
  .rs-chip.vet { background:rgba(90,140,255,.14); color:#8fb0ff; border-color:rgba(90,140,255,.4); }
  .rs-verified { color:#4ad66b; font-weight:900; }

  /* owner approval queue */
  .rs-queue { margin:26px 0; padding:18px; border-radius:14px; background:rgba(214,30,44,0.06); border:1px solid rgba(214,30,44,0.3); }
  .rs-queue h3 { margin:0 0 12px; }
  .rs-q-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--panel-border); flex-wrap:wrap; }
  .rs-q-row .grow { flex:1; min-width:160px; }
  .rs-mini { font-size:12px; font-weight:700; padding:7px 12px; border-radius:9px; cursor:pointer; border:1px solid var(--panel-border); background:rgba(255,255,255,.05); color:var(--text); }
  .rs-mini.ok { background:rgba(74,214,107,.16); border-color:rgba(74,214,107,.5); color:#8fe6a3; }
  .rs-mini.no { background:rgba(160,160,170,.12); }
  .rs-hidden { display:none !important; }
  .rs-loading { text-align:center; color:var(--muted); padding:40px 0; }

  /* owner tabs */
  .rs-tabs { display:flex; gap:8px; justify-content:center; margin:6px 0 18px; flex-wrap:wrap; }
  .rs-tab { padding:9px 18px; border-radius:999px; font-weight:800; font-size:13px; cursor:pointer;
    border:1px solid var(--panel-border); background:rgba(255,255,255,.04); color:var(--text); }
  .rs-tab.active { background:linear-gradient(120deg,var(--accent-2),var(--accent)); color:#fff; border-color:transparent; }
  /* inline reassign controls on owner cards */
  .rs-assign { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .rs-assign select { font-size:11px; padding:4px 6px; border-radius:7px; background:rgba(0,0,0,.3);
    border:1px solid var(--panel-border); color:var(--text); }
  [data-theme="light"] .rs-assign select { background:rgba(20,60,110,.06); }
  /* attendance grid */
  .rs-att-tools { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin:12px 0; }
  .rs-att-tools input, .rs-att-tools select { padding:9px 12px; border-radius:9px; background:rgba(0,0,0,.25);
    border:1px solid var(--panel-border); color:var(--text); font-size:13px; }
  .rs-event { padding:12px 14px; border-radius:12px; background:var(--panel); border:1px solid var(--panel-border); margin-bottom:10px; }
  .rs-event-h { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .rs-event-h .grow { flex:1; min-width:140px; font-weight:800; }
  .rs-att-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--panel-border); flex-wrap:wrap; }
  .rs-att-row .grow { flex:1; min-width:130px; }
  .rs-att-btns { display:flex; gap:4px; }
  .rs-ab { font-size:11px; font-weight:800; padding:5px 9px; border-radius:7px; cursor:pointer; border:1px solid var(--panel-border); background:rgba(255,255,255,.05); color:var(--muted); }
  .rs-ab.sel.present { background:rgba(74,214,107,.2); color:#8fe6a3; border-color:rgba(74,214,107,.5); }
  .rs-ab.sel.absent  { background:rgba(214,30,44,.2); color:#ff8089; border-color:rgba(214,30,44,.5); }
  .rs-ab.sel.late    { background:rgba(255,180,60,.2); color:#ffb43c; border-color:rgba(255,180,60,.5); }
  .rs-ab.sel.excused { background:rgba(140,150,170,.2); color:#c4ccdc; }
  .rs-rate { font-size:12px; font-weight:800; }
  .rs-rate.hi { color:#4ad66b; } .rs-rate.mid { color:#ffb43c; } .rs-rate.lo { color:#ff8089; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<nav id="site-nav" data-active="roster"></nav>

<div class="content">
  <div class="rs-wrap">
    <div class="section-head" style="margin-bottom:6px;">
      <div class="kicker">⚔️ Guild Operations</div>
      <h2>MミRC Roster</h2>
      <p>The MミRC AION 2 operational roster. Members-only — log in with Discord and sign up to join.</p>
    </div>

    <div id="rs-root">
      <div class="rs-loading">Summoning the roster…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/sol.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/background.js"></script>
<script>
(function () {
  if (!window.Sol) { document.getElementById('rs-root').innerHTML = '<div class="rs-panel"><p>Roster is temporarily unavailable.</p></div>'; return; }
  var root = document.getElementById('rs-root');

  var CLASS_COLOR = {
    Templar:'#d61e2c', Gladiator:'#ff7a45', Sorcerer:'#9d7bff', Ranger:'#4ad66b',
    Assassin:'#ff5563', Cleric:'#ffd24a', Chanter:'#5ad1c8', Spiritmaster:'#8fb0ff'
  };
  var ROLE_ICON = { 'Tank':'🛡️', 'DPS':'⚔️', 'Healer':'✚', 'Support / Off-Heal':'🎶' };
  var CLASSES = ['Templar','Gladiator','Sorcerer','Ranger','Assassin','Cleric','Chanter','Spiritmaster'];
  var ROLES = ['Tank','DPS','Healer','Support / Off-Heal'];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function loginGate() {
    root.innerHTML =
      '<div class="rs-panel">' +
      '<h3>🔒 Members Only</h3>' +
      '<p>The MミRC roster is visible to confirmed guild members. Log in with Discord to sign up.</p>' +
      '<button class="rs-btn discord" id="rs-login">🎮 Log in with Discord</button>' +
      '</div>';
    document.getElementById('rs-login').addEventListener('click', function () { Sol.loginWith('discord'); });
  }

  function signupForm(existing) {
    var isEdit = !!existing;
    var opts = function (arr, sel) { return arr.map(function(v){ return '<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>'; }).join(''); };
    root.innerHTML =
      '<div class="rs-panel">' +
      '<h3>' + (isEdit ? 'Edit your signup' : 'Sign up for the roster') + '</h3>' +
      '<p>Submit your in-game identity. The guild master reviews and confirms you onto the roster.</p>' +
      '<div class="rs-form">' +
        '<div><label>In-game name</label><input id="f-name" maxlength="32" value="' + esc(existing && existing.player_name || '') + '" placeholder="Your AION 2 character name"></div>' +
        '<div><label>Class</label><select id="f-class">' + opts(CLASSES, existing && existing.aion_class) + '</select></div>' +
        '<div><label>Role</label><select id="f-role">' + opts(ROLES, existing && existing.guild_role) + '</select></div>' +
        '<div><label>Note (optional)</label><textarea id="f-note" rows="2" maxlength="200" placeholder="Anything the guild master should know">' + esc(existing && existing.note || '') + '</textarea></div>' +
        '<button class="rs-btn" id="f-submit">' + (isEdit ? 'Update signup' : 'Submit signup') + '</button>' +
        '<div id="f-msg" style="color:var(--muted);font-size:13px;"></div>' +
      '</div></div>';
    document.getElementById('f-submit').addEventListener('click', function () {
      var name = document.getElementById('f-name').value.trim();
      var cls = document.getElementById('f-class').value;
      var role = document.getElementById('f-role').value;
      var note = document.getElementById('f-note').value.trim();
      var msg = document.getElementById('f-msg');
      if (name.length < 2) { msg.textContent = 'Enter your in-game name (2+ characters).'; return; }
      msg.textContent = 'Submitting…';
      Sol.rosterSignup(name, cls, role, note).then(function () { render(); })
        .catch(function (e) { msg.textContent = 'Could not submit: ' + (e.message || 'try again'); });
    });
  }

  function pendingScreen(row) {
    var rejected = row.status === 'rejected';
    root.innerHTML =
      '<div class="rs-panel">' +
      '<h3>' + (rejected ? 'Signup not approved' : '⏳ Awaiting confirmation') + '</h3>' +
      '<p><span class="rs-status-badge ' + (rejected?'rejected':'pending') + '">' + (rejected?'Rejected':'Pending review') + '</span></p>' +
      '<p>' + (rejected
        ? 'Your signup was not approved. You can edit and resubmit, or reach out in Discord.'
        : 'Your signup as <strong>' + esc(row.player_name) + '</strong> (' + esc(row.aion_class) + ' · ' + esc(row.guild_role) + ') is awaiting the guild master. You will see the full roster once confirmed.') + '</p>' +
      '<button class="rs-btn" id="rs-edit">Edit my signup</button>' +
      '</div>';
    document.getElementById('rs-edit').addEventListener('click', function () { signupForm(row); });
  }

  function rosterCard(m) {
    var color = CLASS_COLOR[m.aion_class] || '#888';
    var avatar = m.linked_avatar || Sol.DEFAULT_AVATAR;
    var chips = '';
    if (m.war_status) chips += '<span class="rs-chip war">War</span>';
    if (m.is_core)    chips += '<span class="rs-chip core">Core</span>';
    if (m.tw_vet)     chips += '<span class="rs-chip vet">TW Vet</span>';
    if (m.static_team) chips += '<span class="rs-chip">' + esc(m.static_team) + '</span>';
    return '<div class="rs-card" style="--cc:' + color + '">' +
      '<img class="rs-avatar" src="' + esc(avatar) + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
      '<div style="min-width:0;">' +
        '<div class="rs-name">' + (ROLE_ICON[m.guild_role]||'') + ' ' + esc(m.player_name) + ' <span class="rs-verified" title="Confirmed member">✓</span></div>' +
        '<div class="rs-meta" style="color:' + color + '">' + esc(m.aion_class) + ' · ' + esc(m.guild_role) + '</div>' +
        (chips ? '<div class="rs-tag-row">' + chips + '</div>' : '') +
      '</div></div>';
  }

  var GROUP_OPTS = ['Group 1','Group 2','Group 3','Group 4','Group 5','Group 6','Group 7','Group 8','Group 9','Group 10','Reserve'];
  var STATE = { rows: [], summary: null, isOwner: false, isAdmin: false, tab: 'roster' };

  function summaryHtml(summary) {
    if (!summary) return '';
    return '<div class="rs-summary">' +
      '<div class="rs-stat"><div class="n">' + (summary.confirmed||0) + '</div><div class="l">Roster</div></div>' +
      '<div class="rs-stat"><div class="n">' + (summary.war_ready||0) + '</div><div class="l">War Ready</div></div>' +
      '<div class="rs-stat"><div class="n">' + (summary.tanks||0) + '</div><div class="l">Tanks</div></div>' +
      '<div class="rs-stat"><div class="n">' + (summary.healers||0) + '</div><div class="l">Healers</div></div>' +
      '<div class="rs-stat"><div class="n">' + (summary.dps||0) + '</div><div class="l">DPS</div></div>' +
      '<div class="rs-stat"><div class="n">' + (summary.support||0) + '</div><div class="l">Support</div></div>' +
    '</div>';
  }

  // Owner card variant with inline group/team reassignment.
  function ownerCard(m) {
    var color = CLASS_COLOR[m.aion_class] || '#888';
    var gOpts = GROUP_OPTS.map(function(g){ return '<option'+(g===m.assigned_group?' selected':'')+'>'+esc(g)+'</option>'; }).join('');
    var teamOpts = ['—','Team 1','Team 2','Team 3','Team 4','Team 5','Team 6','Team 7','Team 8','Team 9','Team 10']
      .map(function(t){ var v=(t==='—'?'':t); return '<option value="'+esc(v)+'"'+(v===(m.static_team||'')?' selected':'')+'>'+esc(t)+'</option>'; }).join('');
    return '<div class="rs-card" style="--cc:' + color + '">' +
      '<div style="min-width:0;flex:1;">' +
        '<div class="rs-name">' + (ROLE_ICON[m.guild_role]||'') + ' ' + esc(m.player_name) + '</div>' +
        '<div class="rs-meta" style="color:' + color + '">' + esc(m.aion_class) + ' · ' + esc(m.guild_role) + '</div>' +
        '<div class="rs-assign">' +
          '<select data-move="group" data-id="' + m.id + '">' + gOpts + '</select>' +
          '<select data-move="team" data-id="' + m.id + '">' + teamOpts + '</select>' +
        '</div>' +
      '</div></div>';
  }

  function renderRosterTab() {
    var confirmed = STATE.rows.filter(function(r){ return r.status === 'confirmed'; });
    var groups = {};
    confirmed.forEach(function (m) { var g = m.assigned_group || 'Unassigned'; (groups[g]=groups[g]||[]).push(m); });
    var gk = Object.keys(groups).sort(function(a,b){
      if (a==='Reserve') return 1; if (b==='Reserve') return -1;
      if (a==='Unassigned') return 1; if (b==='Unassigned') return -1;
      return a.localeCompare(b, undefined, {numeric:true});
    });
    var html = '';
    // admin approval queue (owner + delegated admins)
    if (STATE.isAdmin) {
      var pending = STATE.rows.filter(function(r){ return r.status === 'pending'; });
      html += '<div class="rs-queue"><h3>🛡️ Approval Queue (' + pending.length + ')</h3>' +
        (pending.length ? pending.map(function (p) {
          return '<div class="rs-q-row"><div class="grow"><strong>' + esc(p.player_name) + '</strong> — ' + esc(p.aion_class) + ' · ' + esc(p.guild_role) +
            (p.note ? '<div class="rs-meta">“' + esc(p.note) + '”</div>' : '') + '</div>' +
            '<button class="rs-mini ok" data-act="confirm" data-id="' + p.id + '">Confirm</button>' +
            '<button class="rs-mini no" data-act="reject" data-id="' + p.id + '">Reject</button></div>';
        }).join('') : '<div class="rs-meta">No pending signups.</div>') + '</div>';
    }
    // OWNER-ONLY: manage roster admins (delegate admin rights)
    if (STATE.isOwner) {
      html += '<div class="rs-queue" style="border-color:rgba(255,210,74,0.4);background:rgba(255,210,74,0.06);">' +
        '<h3>👑 Roster Admins</h3>' +
        '<div class="rs-meta" style="margin-bottom:8px;">Promote confirmed members to admin so they can approve signups, assign groups, and record attendance. Only you can grant or revoke admin.</div>' +
        confirmed.map(function (m) {
          return '<div class="rs-q-row"><div class="grow"><strong>' + esc(m.player_name) + '</strong> — ' + esc(m.aion_class) + ' · ' + esc(m.guild_role) +
            (m.is_admin ? ' <span class="rs-chip core">Admin</span>' : '') + '</div>' +
            '<button class="rs-mini ' + (m.is_admin?'no':'ok') + '" data-admin="' + (m.is_admin?'0':'1') + '" data-id="' + m.id + '">' +
              (m.is_admin ? 'Revoke admin' : 'Make admin') + '</button></div>';
        }).join('') + '</div>';
    }
    gk.forEach(function (g) {
      var cardFn = STATE.isAdmin ? ownerCard : rosterCard;
      html += '<div class="rs-group"><div class="rs-group-h">' + esc(g) + ' · ' + groups[g].length + '</div>' +
        '<div class="rs-cards">' + groups[g].map(cardFn).join('') + '</div></div>';
    });
    if (!confirmed.length) html += '<div class="rs-loading">No confirmed members yet.</div>';
    return html;
  }

  function renderEventsTab() {
    return '<div class="rs-att-tools">' +
      '<div><label style="font-size:12px;font-weight:700;">Event title</label><br><input id="ev-title" placeholder="Fortress Siege"></div>' +
      '<div><label style="font-size:12px;font-weight:700;">Type</label><br>' +
        '<select id="ev-type"><option>Siege</option><option>GvG</option><option>Raid</option><option>Rift</option><option>Other</option></select></div>' +
      '<button class="rs-btn" id="ev-create">+ Create event</button>' +
    '</div>' +
    '<div id="ev-list" class="rs-loading">Loading events…</div>';
  }

  function memberView(rows, summary, isOwner, isAdmin) {
    STATE.rows = rows; STATE.summary = summary;
    if (isOwner !== undefined) STATE.isOwner = isOwner;
    if (isAdmin !== undefined) STATE.isAdmin = isAdmin;
    var tabs = STATE.isAdmin
      ? '<div class="rs-tabs">' +
          '<div class="rs-tab' + (STATE.tab==='roster'?' active':'') + '" data-tab="roster">Roster</div>' +
          '<div class="rs-tab' + (STATE.tab==='events'?' active':'') + '" data-tab="events">Events &amp; Attendance</div>' +
        '</div>'
      : '';
    var body = (STATE.isAdmin && STATE.tab === 'events') ? renderEventsTab() : renderRosterTab();
    root.innerHTML = summaryHtml(summary) + tabs + '<div id="rs-body">' + body + '</div>';
    wireOwnerControls();
    if (STATE.isAdmin && STATE.tab === 'events') loadEvents();
  }

  function wireOwnerControls() {
    // tabs
    root.querySelectorAll('.rs-tab').forEach(function (t) {
      t.addEventListener('click', function () { STATE.tab = t.getAttribute('data-tab'); memberView(STATE.rows, STATE.summary); });
    });
    // OWNER-ONLY: grant/revoke admin
    root.querySelectorAll('.rs-mini[data-admin]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = parseInt(b.getAttribute('data-id'),10), makeAdmin = b.getAttribute('data-admin')==='1';
        b.disabled = true; b.textContent = '…';
        Sol.rosterSetAdmin(id, makeAdmin).then(function () {
          Sol.fetchRoster().then(function (rows) { STATE.rows = rows; memberView(rows, STATE.summary); });
        });
      });
    });
    if (!STATE.isAdmin) return;
    // approve / reject
    root.querySelectorAll('.rs-mini[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = parseInt(b.getAttribute('data-id'),10), act = b.getAttribute('data-act');
        b.disabled = true; b.textContent = '…';
        (act==='confirm'?Sol.rosterConfirm(id):Sol.rosterReject(id)).then(render);
      });
    });
    // inline group/team reassignment (rebuild)
    root.querySelectorAll('select[data-move]').forEach(function (sel) {
      sel.addEventListener('change', function () {
        var id = parseInt(sel.getAttribute('data-id'),10);
        var card = sel.closest('.rs-card');
        var group = card.querySelector('select[data-move="group"]').value;
        var team = card.querySelector('select[data-move="team"]').value;
        Sol.rosterMove(id, group, team).then(function () {
          // refresh underlying rows so subsequent regroup is correct
          Sol.fetchRoster().then(function (rows) { STATE.rows = rows; memberView(rows, STATE.summary, STATE.isOwner); });
        });
      });
    });
    // event create
    var evc = root.querySelector('#ev-create');
    if (evc) evc.addEventListener('click', function () {
      var title = (root.querySelector('#ev-title').value||'').trim();
      var type = root.querySelector('#ev-type').value;
      if (title.length < 2) { root.querySelector('#ev-title').focus(); return; }
      evc.disabled = true; evc.textContent = 'Creating…';
      Sol.eventCreate(title, type).then(function () { evc.disabled=false; evc.textContent='+ Create event'; loadEvents(); });
    });
  }

  function rateClass(pct){ return pct==null?'':(pct>=80?'hi':(pct>=50?'mid':'lo')); }

  function loadEvents() {
    var list = root.querySelector('#ev-list'); if (!list) return;
    Promise.all([Sol.fetchEvents(), Sol.fetchAttendanceRates()]).then(function (res) {
      var events = res[0]||[], rates = res[1]||[];
      // attendance-rate leaderboard (drives dynamic rebuilds)
      var ratesSorted = rates.slice().sort(function(a,b){ return (b.attend_pct||0)-(a.attend_pct||0); });
      var ratesHtml = '<div class="rs-event"><div class="rs-event-h"><span class="grow">📊 Attendance rates (informs roster rebuilds)</span></div>' +
        (ratesSorted.length ? ratesSorted.map(function(r){
          return '<div class="rs-att-row"><span class="grow">' + esc(r.player_name) + ' <span class="rs-meta">'+esc(r.aion_class)+' · '+esc(r.guild_role)+'</span></span>' +
            '<span class="rs-rate ' + rateClass(r.attend_pct) + '">' + (r.attend_pct==null?'—':r.attend_pct+'%') + '</span>' +
            '<span class="rs-meta">('+ (r.attended||0) +'/'+ (r.recorded||0) +')</span></div>';
        }).join('') : '<div class="rs-meta">No attendance recorded yet.</div>') + '</div>';

      if (!events.length) { list.innerHTML = ratesHtml + '<div class="rs-meta">No events yet. Create one above.</div>'; return; }
      // render each event with a mark grid (owner marks each confirmed member)
      var confirmed = STATE.rows.filter(function(r){ return r.status==='confirmed'; });
      Promise.all(events.map(function(e){ return Sol.fetchAttendance(e.id); })).then(function (attArr) {
        var evHtml = events.map(function (e, i) {
          var att = {}; (attArr[i]||[]).forEach(function(a){ att[a.member_id]=a.status; });
          var when = e.starts_at ? new Date(e.starts_at).toLocaleDateString() : '';
          var rows = confirmed.map(function (m) {
            function ab(s,lbl){ var sel=att[m.id]===s?' sel '+s:''; return '<button class="rs-ab'+sel+'" data-ev="'+e.id+'" data-mem="'+m.id+'" data-st="'+s+'">'+lbl+'</button>'; }
            return '<div class="rs-att-row"><span class="grow">'+esc(m.player_name)+'</span><span class="rs-att-btns">'+
              ab('present','P')+ab('late','L')+ab('absent','A')+ab('excused','E')+'</span></div>';
          }).join('');
          return '<div class="rs-event"><div class="rs-event-h">'+
            '<span class="grow">'+esc(e.title)+' <span class="rs-meta">'+esc(e.event_type||'')+' · '+when+'</span></span>'+
            '<span class="rs-chip">✅ '+ (e.present_count||0) +'</span>'+
            '</div>'+rows+'</div>';
        }).join('');
        list.innerHTML = ratesHtml + evHtml;
        // wire attendance buttons
        list.querySelectorAll('.rs-ab').forEach(function (b) {
          b.addEventListener('click', function () {
            var ev=parseInt(b.getAttribute('data-ev'),10), mem=parseInt(b.getAttribute('data-mem'),10), st=b.getAttribute('data-st');
            Sol.attendMark(ev, mem, st).then(function () { loadEvents(); });
          });
        });
      });
    });
  }

  function render() {
    Sol.getUser().then(function (user) {
      if (!user) { loginGate(); return; }
      // Resolve identity FIRST: owner/admin always get the roster, never the
      // pending gate. Regular users follow signup -> pending -> confirmed.
      Promise.all([Sol.myRoster(), Sol.myProfile(), Sol.amIRosterAdmin()]).then(function (res) {
        var mine = res[0], profile = res[1], isAdmin = !!res[2];
        var isOwner = !!(profile && profile.role === 'sol_king');
        var privileged = isOwner || isAdmin;

        // No signup row yet: owner/admin still shouldn't be gated (rare), but
        // normally they'll have a row. Non-privileged users see the signup form.
        if (!mine && !privileged) { signupForm(null); return; }

        if (privileged || (mine && mine.status === 'confirmed')) {
          Promise.all([Sol.fetchRoster(), Sol.rosterSummary()]).then(function (r2) {
            memberView(r2[0] || [], r2[1], isOwner, isAdmin);
          });
        } else {
          pendingScreen(mine);   // pending or rejected (non-privileged only)
        }
      });
    });
  }

  render();
  Sol.onAuthChange(function () { render(); });
})();
</script>
</body>
</html>
