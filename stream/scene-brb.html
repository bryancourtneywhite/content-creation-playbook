<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolAshur - Be Right Back</title>
<link rel="stylesheet" href="theme.css">
<!--
  ============================================================================
  BE RIGHT BACK - 1920x1080 full-screen OBS scene
  Drifting Akatsuki clouds + shuriken background, calmer reishi drift,
  rune ring and title text.
  OBS: Browser source, 1920x1080, "Local file" -> this file.
  ============================================================================
-->
<style>
  canvas.layer { position:absolute; inset:0; width:100%; height:100%; }
  #ui { position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end; padding-bottom:9vh; text-align:center; }
  #title { font-size: 6.4vmin; animation: fadeUp .9s ease both; }
  #sub  { margin-top: 1.4vh; font-size: 2vmin; letter-spacing: 6px; text-transform: uppercase;
  color: var(--reishi-dim); animation: fadeUp 1.1s ease both; }
  .top-plate { position:absolute; top:5vh; left:50%; transform:translateX(-50%); font-size:1.8vmin; }
  #socials { position:absolute; bottom:3vh; width:100%; display:flex; gap:34px; justify-content:center;
  font-size:1.7vmin; letter-spacing:2px; color:var(--reishi-dim); }
  #socials b { color:#fff; }
</style>
</head>
<body class="scene">
  <canvas id="clouds" class="layer"></canvas>
  <canvas id="bg"  class="layer"></canvas>
  <div class="rune-ring" style="width:70vmin;height:70vmin;top:46%;left:50%;transform:translate(-50%,-50%);opacity:.7;"></div>

  <div class="plate top-plate">SOLASHUR<small>ASHURA WHOLE HEAVENS</small></div>

  <div id="ui">
  <div id="title" class="title accent-text">BE RIGHT BACK</div>
  <div id="sub">The blade rests - grabbing a moment</div>
  </div>

  <div id="socials">
  <span>YouTube <b>@SolAshur</b></span>
  <span>Web <b>solashur.com</b></span>
  <span>Don't go anywhere</span>
  </div>

<script>
  (function(){ var p=new URLSearchParams(location.search);
  if (p.get('theme')==='light') document.documentElement.setAttribute('data-theme','light'); })();
</script>
<script src="engine.js"></script>
<script>
var CONFIG = { title: 'BE RIGHT BACK', subtitle: 'The blade rests - grabbing a moment' };
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('sub').textContent  = CONFIG.subtitle;

(function () {
  var S = window.Solashur;
  var clouds = new S.CloudField(document.getElementById('clouds'), { count: 8 });
  var reishi = new S.Reishi(document.getElementById('bg'), { count: 60, drift: 9 });

  var last = 0;
  S.raf(function (t) {
  var dt = Math.min(0.05, t - last); last = t;
  clouds.step(t, dt);
  reishi.step(t, dt);
  });
})();
</script>
</body>
</html>
