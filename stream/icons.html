<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="sTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolAshur - Custom Icon Set</title>
<link rel="stylesheet" href="theme.css">
<!--
  ============================================================================
  CsSTOM ICON SET - editable inline SVG, brand-themed
  Scalable icons for your labels, scenes, panels and buttons. Every icon is a
  self-contained <svg> using currentColor so it recolors via CSS `color`.
  COPY any icon's <svg>...</svg> block straight into a scene, panel, or website.
  Uses the shared brand electric blue by default; change `color:` to recolor.
  Icons: zanpakuto, feather, wing, eclipsed moon, hollow, live-dot, follow,
  youtube, twitch, discord, x, chat, gamepad, heart, star.
  ============================================================================
-->
<style>
  body { background: radial-gradient(1200px 700px at 50% 30%, #1a141d, var(--ink) 60%, var(--void)); padding:40px; overflow:auto; }
  h1 { font-family:var(--font-display); letter-spacing:3px; text-transform:uppercase;
  color:#fff; text-shadow:var(--glow-md); margin-bottom:6px; }
  p.note { color:var(--reishi-dim); margin-bottom:28px; max-width:760px; line-height:1.5; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px; }
  .cell { background:rgba(255,255,255,0.02); border:1px solid rgba(30,144,255,0.25);
  border-radius:14px; padding:18px; text-align:center; }
  .cell svg { width:56px; height:56px; color:var(--accent-2);
  filter: drop-shadow(0 0 8px rgba(30,144,255,0.6)); }
  .cell .n { margin-top:10px; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--reishi-dim); }
  .swatches { margin:22px 0 34px; display:flex; gap:14px; align-items:center; color:var(--reishi-dim); font-size:13px; }
  .sw { width:26px; height:26px; border-radius:6px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
</style>
</head>
<body>
  <h1>SolAshur - Custom Icon Set</h1>
  <p class="note">Editable inline SVG icons in the Hueco Mundo / zanpakuto / angelic wing style.
  Each icon uses <code>currentColor</code>, so set <code>color:</code> on the SVG (or a parent)
  to recolor it. Copy any <code>&lt;svg&gt;</code> block into a scene, panel, overlay, or your website.</p>

  <div class="swatches">
  Brand:
  <span class="sw" style="background:#1e90ff"></span> #1e90ff
  <span class="sw" style="background:#5fd0ff"></span> #5fd0ff
  <span class="sw" style="background:#eaf4ff"></span> #eaf4ff
  <span class="sw" style="background:#05070d"></span> #05070d
  </div>

  <div class="grid" id="grid"></div>

<script>
/* Each icon is a 24x24 viewBox SVG using stroke/fill = currentColor. */
var ICONS = {
  zanpakuto:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M4 20 L14 10 L15 5 L11 6 L4 13 Z" fill="currentColor" opacity="0.15"/>' +
  '<path d="M4 20 L14 10 L15 5 L11 6 L4 13 Z"/>' +
  '<path d="M13 17 l3 3"/><path d="M15.5 15.5 l3.5 3.5"/>' +  /* tsuba + handle */
  '<circle cx="15.5" cy="16.5" r="1.1" fill="currentColor"/></svg>',

  feather:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M19 5 C12 6 7 11 6 18 L4 20" />' +
  '<path d="M19 5 C15 8 11 10 7 14" fill="currentColor" opacity="0.15"/>' +
  '<path d="M17 7 l-8 8 M18 10 l-6 6 M19 13 l-4 4"/></svg>',

  wing:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M3 8 C9 8 12 11 12 18 C12 12 16 9 21 10 C16 10 14 13 14 18" fill="currentColor" opacity="0.12"/>' +
  '<path d="M3 8 C9 8 12 11 12 18"/><path d="M12 18 C12 12 16 9 21 10"/>' +
  '<path d="M5 10 C9 10 11 12 11 16 M8 9 C10 10 11 12 11 14"/></svg>',

  moon:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
  '<circle cx="12" cy="12" r="8" fill="currentColor" opacity="0.12"/>' +
  '<path d="M15 5 a8 8 0 1 0 0 14 a6 6 0 1 1 0 -14 Z"/>' +
  '<path d="M8.5 13 a1.6 1.6 0 1 0 2 -0.4" /></svg>',

  hollow:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M7 12 C6 8 10 6 13 8 C17 9 18 13 15 16 C12 19 8 17 7 12 Z" fill="#050507"/></svg>',

  live:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">' +
  '<circle cx="12" cy="12" r="4" fill="currentColor"/>' +
  '<circle cx="12" cy="12" r="8" opacity="0.5"/></svg>',

  follow:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M12 21 C4 15 3 9 6.5 6.5 C9 4.7 11 6 12 8 C13 6 15 4.7 17.5 6.5 C21 9 20 15 12 21 Z" fill="currentColor" opacity="0.15"/>' +
  '<path d="M12 21 C4 15 3 9 6.5 6.5 C9 4.7 11 6 12 8 C13 6 15 4.7 17.5 6.5 C21 9 20 15 12 21 Z"/></svg>',

  youtube:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">' +
  '<rect x="3" y="6" width="18" height="12" rx="3"/>' +
  '<path d="M11 9 L15 12 L11 15 Z" fill="currentColor"/></svg>',

  twitch:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">' +
  '<path d="M5 4 H20 V14 L16 18 H12 L9 21 V18 H5 Z"/>' +
  '<path d="M11 8 V13 M15 8 V13" stroke-linecap="round"/></svg>',

  discord:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">' +
  '<path d="M7 7 C10 5 14 5 17 7 C19 10 20 14 19 18 C17.5 19 16 19.5 15 19.5 L14 18 C12.7 18.4 11.3 18.4 10 18 L9 19.5 C8 19.5 6.5 19 5 18 C4 14 5 10 7 7 Z"/>' +
  '<circle cx="9.5" cy="13" r="1.1" fill="currentColor"/><circle cx="14.5" cy="13" r="1.1" fill="currentColor"/></svg>',

  x:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">' +
  '<path d="M5 5 L19 19 M19 5 L5 19"/></svg>',

  chat:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">' +
  '<path d="M4 5 H20 V16 H10 L5 20 V16 H4 Z"/>' +
  '<path d="M8 10 H16 M8 13 H13" stroke-linecap="round"/></svg>',

  gamepad:
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">' +
  '<path d="M7 8 H17 C19 8 21 10 21 13 C21 16 18 17 17 15 L15 13 H9 L7 15 C6 17 3 16 3 13 C3 10 5 8 7 8 Z"/>' +
  '<path d="M7 11 V13 M6 12 H8" stroke-linecap="round"/>' +
  '<circle cx="15.5" cy="11.5" r="0.9" fill="currentColor"/><circle cx="17.5" cy="13" r="0.9" fill="currentColor"/></svg>',

  heart:
  '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">' +
  '<path d="M12 20 C4 14 3 9 6.5 6.8 C9 5.2 11 6.5 12 8.4 C13 6.5 15 5.2 17.5 6.8 C21 9 20 14 12 20 Z"/></svg>',

  star:
  '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">' +
  '<path d="M12 3 L14.5 9 L21 9.5 L16 13.5 L17.5 20 L12 16.5 L6.5 20 L8 13.5 L3 9.5 L9.5 9 Z"/></svg>'
};

var grid = document.getElementById('grid');
Object.keys(ICONS).forEach(function (name) {
  var cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = ICONS[name] + '<div class="n">' + name + '</div>';
  grid.appendChild(cell);
});
/* Expose for reuse in other pages: window.SolashurIcons['wing'] etc. */
window.SolashurIcons = ICONS;
</script>
</body>
</html>
