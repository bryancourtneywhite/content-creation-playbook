<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolAshur - Starting Soon</title>
<link rel="stylesheet" href="theme.css">
<!--
  ============================================================================
  STARTING SOON - 1920x1080 full-screen OBS scene
  Drifting Akatsuki clouds + shuriken background (matches solashur.com),
  reishi particles, rune rings, title text + optional live countdown.
  OBS: Browser source, 1920x1080, "Local file" -> this file.
  Edit the CONFIG block for title text, subtitle, socials and countdown.
  ============================================================================
-->
<style>
  #scene { position:absolute; inset:0; }
  canvas.layer { position:absolute; inset:0; width:100%; height:100%; }
  #ui { position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end; padding-bottom:8vh; text-align:center; }
  #title { font-size: 6.2vmin; animation: fadeUp .9s ease both, flicker 6s 1s infinite; }
  #sub  { margin-top: 1.4vh; font-size: 2.1vmin; letter-spacing: 6px;
  text-transform: uppercase; color: var(--reishi-dim); animation: fadeUp 1.1s ease both; }
  #count { margin-top: 2.6vh; font-family: var(--font-display); font-weight: 800;
  font-size: 3.2vmin; letter-spacing: 3px; color:#fff; text-shadow: var(--glow-md);
  animation: fadeUp 1.3s ease both; }
  #socials { position:absolute; bottom:3vh; width:100%; display:flex; gap:34px;
  justify-content:center; font-size:1.7vmin; letter-spacing:2px; color:var(--reishi-dim); }
  #socials b { color:#fff; }
  .top-plate { position:absolute; top:5vh; left:50%; transform:translateX(-50%);
  font-size:1.8vmin; animation: fadeUp .7s ease both; }
</style>
</head>
<body class="scene">
  <div id="scene">
  <canvas id="clouds" class="layer"></canvas>  <!-- Akatsuki clouds + shuriken -->
  <canvas id="bg"  class="layer"></canvas>  <!-- reishi field -->
  <div class="rune-ring" style="width:78vmin;height:78vmin;top:50%;left:50%;transform:translate(-50%,-50%);"></div>
  <div class="rune-ring reverse" style="width:88vmin;height:88vmin;top:50%;left:50%;transform:translate(-50%,-50%);"></div>

  <div class="plate top-plate">SOLASHUR<small>ASHURA WHOLE HEAVENS</small></div>

  <div id="ui">
  <div id="title" class="title accent-text">STREAM STARTING SOON</div>
  <div id="sub">Sharpening the blade - hang tight</div>
  <div id="count"></div>
  </div>

  <div id="socials">
  <span>YouTube <b>@SolAshur</b></span>
  <span>Web <b>solashur.com</b></span>
  <span>Playing <b>AION 2</b></span>
  </div>
  </div>

<script>
  /* Theme: black/red default; ?theme=light for white/blue. */
  (function(){ var p=new URLSearchParams(location.search);
  if (p.get('theme')==='light') document.documentElement.setAttribute('data-theme','light'); })();
</script>
<script src="engine.js"></script>
<script>
/* ==== CONFIG ============================================================== */
var CONFIG = {
  title:  'STREAM STARTING SOON',
  subtitle: 'Sharpening the blade - hang tight',
  // Countdown: minutes from when the scene loads. Set to 0/null to hide.
  countdownMinutes: 10,
  countdownDoneText: "LET'S GO"
};

document.getElementById('title').textContent = CONFIG.title;
document.getElementById('sub').textContent  = CONFIG.subtitle;

/* ==== Countdown =========================================================== */
(function () {
  var el = document.getElementById('count');
  if (!CONFIG.countdownMinutes) { el.style.display = 'none'; return; }
  var end = Date.now() + CONFIG.countdownMinutes * 60000;
  function tick() {
  var ms = end - Date.now();
  if (ms <= 0) { el.textContent = CONFIG.countdownDoneText; return; }
  var m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
  el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
  requestAnimationFrame(tick);
  }
  tick();
})();

/* ==== Scene render ======================================================== */
(function () {
  var S = window.Solashur;
  var bg = document.getElementById('bg');
  var clouds = new S.CloudField(document.getElementById('clouds'), { count: 9 });
  var reishi = new S.Reishi(bg, { count: 100, drift: 16 });

  var last = 0;
  S.raf(function (t) {
  var dt = Math.min(0.05, t - last); last = t;
  clouds.step(t, dt);
  reishi.step(t, dt);
  });
})();
</script>
</body>
</html>
