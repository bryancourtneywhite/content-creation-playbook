<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solashur — Hueco Mundo Webcam Frame (OBS overlay)</title>
<!--
  ============================================================================
  HUECO MUNDO WEBCAM FRAME — OBS Browser Source overlay
  ----------------------------------------------------------------------------
  Matches solashur.com: Akatsuki crimson (#d61e2c) + Hueco Mundo crescent moon,
  pale "reishi" particles, black night. Pure code — no image files needed.

  HOW IT WORKS
  - This overlay draws a glowing CIRCULAR moon frame with a TRANSPARENT hole in
    the middle. In OBS you place your WEBCAM source BEHIND this Browser Source;
    your face shows through the hole, ringed by the glowing crescent frame.

  HOW TO ADD IN OBS
  1. Sources -> + -> Browser.
  2. Check "Local file" and pick this file (stream/webcam-moon.html), OR host it
     and paste the URL (e.g. https://solashur.com/stream/webcam-moon.html).
  3. Set Width 600, Height 600 (or any square; it scales). Check "Shutdown
     source when not visible" OFF so it keeps animating.
  4. Add your WEBCAM (Video Capture Device) as a source and drag it BELOW this
     overlay in the source list, sized/positioned so your face fills the circle.
  5. (Optional) The bottom nameplate shows "SOLASHUR"; edit the NAME below.

  TUNABLES: see the :root CSS variables + the CONFIG block near the bottom.
  ============================================================================
-->
<style>
  :root {
    --accent:   #d61e2c;   /* Akatsuki crimson */
    --accent-2: #ff5563;   /* bright red glow  */
    --moon:     #eef2ff;   /* pale reishi moon */
    --ink:      #0d0b0d;   /* Hueco Mundo black */
    --ring:     10px;      /* frame ring thickness */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;   /* OBS composites over your other sources */
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }
  /* The stage is a square that centers the circular frame. */
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  /* The frame: a ring around a transparent center (webcam shows through). */
  #frame {
    position: relative;
    width: 92vmin; height: 92vmin;
    border-radius: 50%;
    /* The visible ring is a conic/radial glow; the center stays clear. */
    background:
      radial-gradient(circle at 50% 50%,
        transparent 0,
        transparent calc(50% - var(--ring) - 2px),
        rgba(214,30,44,0.0) calc(50% - var(--ring) - 2px),
        var(--accent) calc(50% - var(--ring)),
        var(--accent-2) calc(50% - var(--ring) * 0.35),
        var(--accent) 50%,
        transparent calc(50% + 1px));
    filter: drop-shadow(0 0 22px rgba(214,30,44,0.75))
            drop-shadow(0 0 46px rgba(214,30,44,0.35));
    animation: ringPulse 4.5s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%,100% { filter: drop-shadow(0 0 22px rgba(214,30,44,0.75)) drop-shadow(0 0 46px rgba(214,30,44,0.35)); }
    50%     { filter: drop-shadow(0 0 30px rgba(214,30,44,0.95)) drop-shadow(0 0 64px rgba(214,30,44,0.5)); }
  }
  /* Slow-rotating outer rune ring for motion + depth. */
  #runes {
    position: absolute; inset: -3%;
    border-radius: 50%;
    border: 2px dashed rgba(255,85,99,0.45);
    animation: spin 40s linear infinite;
  }
  #runes.reverse { inset: -7%; border-style: dotted; border-color: rgba(214,30,44,0.3); animation-duration: 64s; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* The crescent moon accent, layered on the ring's upper-right (Hueco Mundo). */
  #moon {
    position: absolute; top: -4%; right: 4%;
    width: 26%; height: 26%;
    pointer-events: none;
  }

  /* Orbiting reishi particles canvas sits over the ring (not the face hole). */
  #particles { position: absolute; inset: 0; pointer-events: none; }

  /* Nameplate at the bottom of the frame. */
  #plate {
    position: absolute; left: 50%; bottom: -1%;
    transform: translateX(-50%);
    padding: 8px 26px; border-radius: 999px;
    background: linear-gradient(120deg, var(--accent-2), var(--accent));
    color: #fff; font-weight: 800; letter-spacing: 3px; font-size: 2.4vmin;
    text-transform: uppercase;
    box-shadow: 0 6px 20px rgba(214,30,44,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
    white-space: nowrap;
  }
  #plate small { display:block; font-size: 1.3vmin; letter-spacing: 2px; opacity: 0.85; font-weight: 700; }
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <div id="runes"></div>
      <div id="runes" class="reverse"></div>
      <canvas id="particles"></canvas>
      <canvas id="moon"></canvas>
      <div id="plate">SOLASHUR<small>ASHURA WHOLE HEAVENS</small></div>
    </div>
  </div>

<script>
/* ==== CONFIG ==== */
var NAME = 'SOLASHUR';                 // change the nameplate here
var SUBTITLE = 'ASHURA WHOLE HEAVENS'; // small line under the name
var PARTICLE_COUNT = 60;               // orbiting reishi particles

document.querySelector('#plate').innerHTML =
  NAME + '<small>' + SUBTITLE + '</small>';

/* ==== Crescent moon (same carve technique as the website background) ==== */
(function () {
  var c = document.getElementById('moon');
  var size = 220; c.width = c.height = size;
  var ctx = c.getContext('2d');
  var cx = size/2, cy = size/2, r = size*0.42;
  // soft glow
  var glow = ctx.createRadialGradient(cx, cy, r*0.6, cx, cy, r*1.7);
  glow.addColorStop(0, 'rgba(230,235,255,0.4)');
  glow.addColorStop(1, 'rgba(230,235,255,0)');
  ctx.fillStyle = glow; ctx.fillRect(0,0,size,size);
  // full disc
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = '#eef2ff';
  ctx.shadowColor = 'rgba(220,230,255,0.85)'; ctx.shadowBlur = 26;
  ctx.fill();
  // carve crescent by subtracting an offset circle
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.arc(cx + r*0.5, cy - r*0.22, r*0.96, 0, Math.PI*2); ctx.fill();
  ctx.restore();
})();

/* ==== Orbiting reishi particles around the ring ==== */
(function () {
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var parts = [];
  function resize() {
    var f = document.getElementById('frame');
    canvas.width = f.clientWidth;
    canvas.height = f.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  var cx = function () { return canvas.width/2; };
  var cy = function () { return canvas.height/2; };
  var baseR = function () { return canvas.width * 0.5; };  // ring radius

  for (var i = 0; i < PARTICLE_COUNT; i++) {
    parts.push({
      a: Math.random() * Math.PI * 2,                 // orbit angle
      radMul: 0.99 + Math.random() * 0.09,            // radius as a fraction of ring radius
      spd: (0.0006 + Math.random() * 0.0018) * (Math.random() < 0.5 ? -1 : 1),
      size: 0.8 + Math.random() * 2.2,
      tw: Math.random() * Math.PI * 2,                // twinkle phase
      twSpd: 0.02 + Math.random() * 0.05
    });
  }

  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var R = baseR();
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.a += p.spd;
      p.tw += p.twSpd;
      var pr = R * p.radMul;                          // orbit just outside the ring
      var x = cx() + Math.cos(p.a) * pr;
      var y = cy() + Math.sin(p.a) * pr;
      var alpha = 0.35 + Math.abs(Math.sin(p.tw)) * 0.6;
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(230,235,255,' + alpha.toFixed(2) + ')';
      ctx.shadowColor = 'rgba(214,30,44,0.8)';
      ctx.shadowBlur = 6;
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
