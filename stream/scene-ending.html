<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SolAshur - Stream Ending</title>
<link rel="stylesheet" href="theme.css">
<!--
  ============================================================================
  STREAM ENDING - 1920x1080 full-screen OBS scene
  Drifting Akatsuki clouds + shuriken background, reishi particles,
  rune rings, thanks + follow/socials text.
  OBS: Browser source, 1920x1080, "Local file" -> this file.
  ============================================================================
-->
<style>
  canvas.layer { position:absolute; inset:0; width:100%; height:100%; }
  #ui { position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-end; padding-bottom:8vh; text-align:center; }
  #title { font-size: 6.6vmin; animation: fadeUp .9s ease both; }
  #sub  { margin-top: 1.2vh; font-size: 2.1vmin; letter-spacing: 5px; text-transform:uppercase;
  color: var(--reishi-dim); animation: fadeUp 1.1s ease both; }
  #follow { margin-top: 2.4vh; }
  #follow .plate { font-size: 2.2vmin; animation: pulseGlow 3s infinite; }
  .top-plate { position:absolute; top:5vh; left:50%; transform:translateX(-50%); font-size:1.8vmin; }
  #socials { position:absolute; bottom:3vh; width:100%; display:flex; gap:40px; justify-content:center;
  font-size:1.8vmin; letter-spacing:2px; color:var(--reishi-dim); }
  #socials b { color:#fff; }
</style>
</head>
<body class="scene">
  <canvas id="clouds" class="layer"></canvas>
  <canvas id="bg"  class="layer"></canvas>
  <div class="rune-ring" style="width:82vmin;height:82vmin;top:44%;left:50%;transform:translate(-50%,-50%);"></div>
  <div class="rune-ring reverse" style="width:94vmin;height:94vmin;top:44%;left:50%;transform:translate(-50%,-50%);"></div>

  <div class="plate top-plate">SOLASHUR<small>ASHURA WHOLE HEAVENS</small></div>

  <div id="ui">
  <div id="title" class="title accent-text">THANKS FOR WATCHING</div>
  <div id="sub">Until the next ascension</div>
  <div id="follow"><span class="plate">FOLLOW &amp; SUBSCRIBE - @SOLASHUR</span></div>
  </div>

  <div id="socials">
  <span>YouTube <b>@SolAshur</b></span>
  <span>Web <b>solashur.com</b></span>
  <span>Discord <b>solashur</b></span>
  <span>X <b>@SolAshur</b></span>
  </div>

<script>
  (function(){ var p=new URLSearchParams(location.search);
  if (p.get('theme')==='light') document.documentElement.setAttribute('data-theme','light'); })();
</script>
<script src="engine.js"></script>
<script>
var CONFIG = {
  title: 'THANKS FOR WATCHING',
  subtitle: 'Until the next ascension',
  followText: 'FOLLOW & SUBSCRIBE - @SOLASHUR'
};
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('sub').textContent  = CONFIG.subtitle;
document.querySelector('#follow .plate').textContent = CONFIG.followText;

(function () {
  var S = window.Solashur;
  var clouds = new S.CloudField(document.getElementById('clouds'), { count: 10 });
  var reishi = new S.Reishi(document.getElementById('bg'), { count: 120, drift: 22 });

  var last = 0;
  S.raf(function (t) {
  var dt = Math.min(0.05, t - last); last = t;
  clouds.step(t, dt);
  reishi.step(t, dt);
  });
})();
</script>
</body>
</html>
